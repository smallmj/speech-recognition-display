<?xml version="1.0" encoding="UTF-8"?>
<!--
  TalkSee / 语见 — Horizontal Logo (深色背景版本)
  配套深色主题的 logo,适合 GitHub README 暗色模式、官网 hero 深色区
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="waveGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="textGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="#0F0F23"/>

  <!-- 左侧 mark 图标 -->
  <g transform="translate(40 40)">
    <rect x="0" y="0" width="280" height="280" rx="62" ry="62"
          fill="#1E1B4B" stroke="#312E81" stroke-width="2"/>

    <g stroke="url(#waveGradD)" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M 30 130 Q 50 100 70 130 T 110 130 T 150 130 T 190 130 T 230 130 L 260 130"/>
    </g>

    <rect x="30" y="170" width="220" height="56" rx="14"
          fill="#312E81" opacity="0.7"/>
    <rect x="30" y="170" width="220" height="56" rx="14"
          fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.5"/>

    <g transform="translate(48 188)">
      <rect x="0"  y="6"  width="2.5" height="14" rx="1.2" fill="url(#waveGradD)"/>
      <rect x="6"  y="2"  width="2.5" height="22" rx="1.2" fill="url(#waveGradD)"/>
      <rect x="12" y="5"  width="2.5" height="16" rx="1.2" fill="url(#waveGradD)"/>
      <rect x="18" y="0"  width="2.5" height="26" rx="1.2" fill="url(#waveGradD)"/>
      <rect x="24" y="6"  width="2.5" height="14" rx="1.2" fill="url(#waveGradD)"/>
    </g>

    <text x="86" y="212" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif"
          font-size="36" font-weight="800" fill="url(#textGradD)" letter-spacing="2">语见</text>
  </g>

  <!-- 右侧文字 -->
  <g transform="translate(360 0)">
    <text x="0" y="180" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif"
          font-size="120" font-weight="800" fill="#FFFFFF" letter-spacing="6">语见</text>
    <text x="6" y="240" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif"
          font-size="46" font-weight="500" fill="#A78BFA" letter-spacing="3">TalkSee · 让对话,看得见</text>
  </g>
</svg>