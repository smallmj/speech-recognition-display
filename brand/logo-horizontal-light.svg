<?xml version="1.0" encoding="UTF-8"?>
<!--
  TalkSee / 语见 — Horizontal Logo (浅色背景版本)
  横向版:左侧 mark 图标 + 右侧中英双行字
  中文"语见"为主,英文"TalkSee"为辅
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="waveGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="textGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- 左侧 mark 图标(squircle) -->
  <g transform="translate(40 40)">
    <!-- 浅色背景版用白底圆角矩形 -->
    <rect x="0" y="0" width="280" height="280" rx="62" ry="62" fill="#FFFFFF"
          stroke="#E2E8F0" stroke-width="2"/>

    <!-- 声波 -->
    <g stroke="url(#waveGradH)" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M 30 130 Q 50 100 70 130 T 110 130 T 150 130 T 190 130 T 230 130 L 260 130"/>
    </g>

    <!-- 字幕条 -->
    <rect x="30" y="170" width="220" height="56" rx="14"
          fill="#1E1B4B" opacity="0.06"/>
    <rect x="30" y="170" width="220" height="56" rx="14"
          fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4"/>

    <!-- 节拍线 -->
    <g transform="translate(48 188)">
      <rect x="0"  y="6"  width="2.5" height="14" rx="1.2" fill="url(#waveGradH)"/>
      <rect x="6"  y="2"  width="2.5" height="22" rx="1.2" fill="url(#waveGradH)"/>
      <rect x="12" y="5"  width="2.5" height="16" rx="1.2" fill="url(#waveGradH)"/>
      <rect x="18" y="0"  width="2.5" height="26" rx="1.2" fill="url(#waveGradH)"/>
      <rect x="24" y="6"  width="2.5" height="14" rx="1.2" fill="url(#waveGradH)"/>
    </g>

    <!-- mark 内的"语见" -->
    <text x="86" y="212" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif"
          font-size="36" font-weight="800" fill="url(#textGradH)" letter-spacing="2">语见</text>
  </g>

  <!-- 右侧文字 -->
  <g transform="translate(360 0)">
    <text x="0" y="180" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif"
          font-size="120" font-weight="800" fill="#0F172A" letter-spacing="6">语见</text>
    <text x="6" y="240" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif"
          font-size="46" font-weight="500" fill="#6366F1" letter-spacing="3">TalkSee · 让对话,看得见</text>
  </g>
</svg>